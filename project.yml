name: NightSky
options:
  bundleIdPrefix: com.sinhaankur
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: DS8C97S284    # Ankur's personal team (same as Kelo)
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: NO
    TARGETED_DEVICE_FAMILY: "1"     # iPhone
    ENABLE_PREVIEWS: YES

targets:
  NightSky:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: NightSky
        CFBundleShortVersionString: "0.1.0"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # --- Privacy usage strings (required or the app crashes on first access) ---
        NSCameraUsageDescription: "NightSky uses the camera to show the live sky and to capture long-exposure night photos."
        NSLocationWhenInUseUsageDescription: "NightSky uses your location to compute exactly where each star, planet, and satellite is in your sky."
        NSMotionUsageDescription: "NightSky uses motion sensors to know where your phone is pointing and to detect when it's steady on a tripod."
        NSPhotoLibraryAddUsageDescription: "NightSky saves your captured night-sky photos to your photo library."
        # LiDAR / world tracking hint
        NSWorldSensingUsageDescription: "NightSky uses the LiDAR scanner to detect the horizon and nearby objects so the sky overlay is correctly occluded."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sinhaankur.nightsky
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: NO
